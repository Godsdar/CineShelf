services:
  db:
    image: postgres:18-alpine
    container_name: nextlearn-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-movies}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18 keeps its cluster in /var/lib/postgresql/18/docker,
      # so we mount the parent dir to persist across image upgrades.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-movies}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
